    * { box-sizing: border-box; }

    .wa-icon { width:25px; height:25px; fill:currentColor; flex:none; }
    .small { font-size:12px; margin:10px 0 0; }
    footer { text-align:center; color:#718198; font-size:11px; padding:10px 8px 0; }
    @media (max-width:480px) {
      main { padding:6px 8px 14px; }
